# Command distribution of the teleop controller (Stage A/B). Mirrors the modes
# of docs/interfaces.md 3.2: STAND (cmd 0, default arms), LOCO/NAV (cmd_vel,
# default arms), MANIP (cmd 0, moving upper-body targets). Each episode has two
# segments [0, switch) and [switch, end); segment modes are drawn below and the
# switch reproduces the legal transitions (stand<->loco, stand<->manip, with
# the ~1 s blend back to default arms when MANIP ends).

cmd_vel:
  # docs/interfaces.md 3.3 velocity limits (defaults): the training envelope
  # must CONTAIN every command the operator can send (skill M2).
  vx_range: [-0.5, 0.8]     # m/s
  vy_range: [-0.4, 0.4]     # m/s
  wz_range: [-1.0, 1.0]     # rad/s
  # |v_xy| below this is zeroed, as legged_gym/unitree_rl_gym do (0.2 there);
  # keyboard steps are 0.1 m/s, so 0.1 keeps the smallest key step walkable.
  zero_below: 0.1
  # teleop changes the command often: resample within a LOCO segment
  resample_s: [2.0, 6.0]
  p_zero_axis: 0.3          # per-axis probability a walk command has that axis 0 (pure fwd/strafe/turn)

base_height:
  # OPTIONAL body-height command for a future VLA/planner (coordinator request
  # 2026-09-29): pelvis height offset from the home height (0.784 m), in the
  # obs ("cmd_base_height") and the sidecar, but DEFAULT-OFF: the range is
  # [0, 0], so every stage trains at the home height and the controller must
  # feed 0 until a curriculum stage widens this range (not scheduled yet).
  enabled: false
  offset_range: [0.0, 0.0]    # m

modes:
  # per-segment probabilities (stand, loco, manip); stage.mode_probs overrides
  p_stand: 0.2
  p_loco: 0.5
  p_manip: 0.3
  p_switch: 0.5             # episode has a second segment with a new mode
  switch_s: [3.0, 15.0]     # when it happens
  # LOCO -> MANIP directly is illegal (contract 3.2): the generator inserts STAND
  # by construction (a switch never goes loco -> manip or manip -> loco).

upper_body:
  # Targets for waist 3 + arms 14 (absolute joint angles, contract order
  # UPPER_IDX). Poses come from configs/upper_body_poses.yaml, GENERATED by
  # scripts/reach_envelope.py (every library pose is statically stable and
  # self-collision free on the full model, and the per-joint box is the
  # feasible teleop envelope). stage.arm_scale blends default -> full pose.
  pose_file: configs/upper_body_poses.yaml
  p_library: 0.6            # else a uniform sample in the feasible joint box (box_lo/box_hi)
  noise_rad: 0.15           # uniform +- per joint added to library poses
  hold_s: [0.5, 3.0]        # hold a waypoint
  # camera teleop hand speed: MediaPipe-driven arm IK moves at <= ~2 rad/s per
  # joint; move time = max(move_s_min, max|dq| / joint_speed_max)
  joint_speed_max: 2.0      # rad/s
  move_s_min: 0.4
  return_to_default_s: 1.0  # contract 3.2: leaving MANIP blends arms back over ~1 s
  # ULTRA reference motions (OMOMO retargeted, Stage C data) as an extra source
  # of upper-body trajectories once downloaded: scripts/build_motion_bank.py
  # writes data/upper_body_bank.npz; p_motion_bank > 0 enables it.
  motion_bank: data/upper_body_bank.npz
  p_motion_bank: 0.0

gait:
  # unitree_rl_gym g1_env.py: phase = (t mod 0.8) / 0.8, right leg offset 0.5,
  # stance while leg phase < 0.55; obs sin/cos(2 pi phase). Same clock as
  # Unitree's pre-trained G1 policy (the contract's placeholder), so
  # g1_controller needs one clock implementation for both.
  period_s: 0.8
  offset: 0.5
  stance_fraction: 0.55
