# Robot profile for the posture / reach-manifold scripts (posture_ik.py,
# manifold_sweep.py). Unitree G1 29-DoF rev 1.0 + BrainCo Revo2 (fixed hands),
# training model generated by scripts/build_assets.py.
robot: Unitree G1 29-DoF rev 1.0 + BrainCo Revo2
# posture_ik.py opens this path as given (no resolution against the profile),
# so it is relative to this repo's root: run the skill scripts from
# g1-whole-body-rl/ (e.g. `python <skill>/scripts/posture_ik.py --profile configs/robot_profile.g1.yaml`).
xml: assets/g1_mjx.xml
keyframe: home
base_body: pelvis
leg_joints_left:
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
right_from_left: [left, right]
# pitch axes keep their sign, roll/yaw negate (G1 legs are mirror-built);
# verified by posture_ik.py --check-mirror (see README "Pre-flight").
mirror_sign: [1, -1, -1, 1, 1, -1]
knee_joint: left_knee_joint
foot_geoms: {left: left_foot, right: right_foot}   # non-colliding sole reference boxes
hand_bodies: [left_wrist_yaw_link, right_wrist_yaw_link]
payload_bodies: [left_wrist_yaw_link, right_wrist_yaw_link]
payload_bodies_dedicated: false
payload_radius: 0.1
ik_iters: 80
ik_damping: 0.05
ik_step: 0.8
ik_tol: 0.002
