# Training configuration: PPO, networks, curricula (Stage A stand, Stage B
# teleop), distillation, checkpoints. NOTHING here has been run beyond the
# dry-run / benchmark (user instruction: no training yet).

env:
  episode_length_s: 20.0          # 1000 control steps at 50 Hz

# Teacher sees NO sensor noise (skill L15); student/distillation envs get the
# full ULTRA uniform noise (domain_rand.yaml obs_noise).
teacher_obs_noise: 0.0
# Instantaneous push is NOT privileged (skill L20): ULTRA pushes are velocity
# kicks the student cannot sense before they happen.
privileged_push: false

ppo:
  # num_envs from scripts/bench.py on the shared RTX 3070 (2026-09-29, full-spec
  # b8 env): 10.1k env steps/s at 256, 19.9k at 1024, 18.9k at 2048, 19.6k at
  # 4096, 20.7k at 8192 -> flat from ~1024; 2048 = the H1-2-validated PPO
  # geometry exactly (skill L12): batch 512 x 4 minibatches x unroll 20 =
  # 40,960 samples per iteration, 10,240-sample minibatches, 16 grad steps.
  # Measured full PPO (b9_full, 1024-wide nets, train.py --ppo_bench, differenced
  # 16 vs 4 iterations): ~13k env steps/s steady state; ~7 min jit per stage.
  num_envs: 2048
  num_eval_envs: 128              # >= 128 for gates (skill M9)
  episode_length: 1000
  unroll_length: 20
  batch_size: 512
  num_minibatches: 4              # batch_size * num_minibatches % num_envs == 0
  num_updates_per_batch: 4
  learning_rate: 3.0e-4           # SKILL (brax PPO, H1-2/X1); ULTRA's 2e-5 is for
                                  # rl_games with 16k minibatches x 6 epochs
  entropy_cost: 5.0e-3            # SKILL; ULTRA 0 with a FIXED std
  # ULTRA rlg gamma 0.99 at 58.8 Hz = 1.7 s horizon; SKILL 0.97 at 50 Hz =
  # 0.67 s. Teleop locomotion + balance: 0.98 (1 s) between the two.
  discounting: 0.98
  gae_lambda: 0.95                # ULTRA rlg tau 0.95 (= SKILL)
  reward_scaling: 1.0
  clipping_epsilon: 0.2           # ULTRA rlg e_clip 0.2 (SKILL used 0.3)
  max_grad_norm: 1.0              # ULTRA rlg grad_norm 1.0
  normalize_observations: true    # ULTRA rlg normalize_input True
  seed: 0

networks:
  # ULTRA rlg g1_teacher.yaml network.mlp.units [1024, 1024, 512], relu,
  # separate actor/critic. The teacher MLP sees [state, privileged]; the critic
  # sees the same (asymmetric actor-critic is free, the critic never ships).
  policy_hidden: [1024, 1024, 512]
  value_hidden: [1024, 1024, 512]
  activation: relu
  # Initial exploration noise in JOINT space: ULTRA's fixed sigma
  # exp(-2.9) = 0.055 x action_scale 3 = 0.165 rad. brax learns the std, so we
  # initialise it per joint as 0.165 / action_scale[j] (legs ~0.3-0.47, arms
  # 0.055) instead of brax's uniform ~0.69.
  init_joint_noise_rad: 0.165

student:
  # ULTRA student (g1_student_vae.yaml / rlg g1_student_vae.yaml): proprio
  # history 10 frames (env.history_len 10), CVAE latent vae_dim 64,
  # prior(student obs) + residual posterior encoder(teacher obs, student obs),
  # decoder MLP [1024, 1024, 512] relu on [current obs, z]; deployment uses the
  # prior mean (docs/deploy.md: "VAE latent noise set to zero").
  history_len: 10
  vae_dim: 64
  prior_hidden: [512, 256]
  encoder_hidden: [1024, 512]     # ULTRA encoder_net 2048 wide; halved for the 3070
  decoder_hidden: [1024, 1024, 512]
  activation: relu

checkpoint:
  interval_s: 300
  eval_every_steps: 5_000_000
  root: outputs/checkpoints

# ---------------------------------------------------------------- curricula
# Each stage changes ONE difficulty factor (skill L13); final stage = full spec
# (pinned by tests/test_curriculum.py). Stages pass on their BEST checkpoint
# (L5). Gates: tracking = (do-nothing floor + 1) / 2 of that stage's command
# distribution (theory 7, M8; computed by curriculum.do_nothing_floor and
# pinned by a test), air time (L4), survival (L16), upper-body tracking.
# Budgets: see README "Training plan" (derived from the benchmark).
# mode_probs = (stand, loco, manip) per segment.
# gate_tracking values = (floor + 1) / 2 from curriculum.do_nothing_floor
# (floors: b1 0.912, b2 0.751, b3-b6 0.822, b7-b9 0.859), pinned by tests.
curricula:
  stand:                          # Stage A: stand & stabilise (deployable fallback)
    - {name: a1_stand, num_timesteps: 50_000_000, cmd_scale: 0.0, dr_scale: 0.0, push_scale: 0.0,
       arm_scale: 0.0, mode_probs: [1.0, 0.0, 0.0], switch_enabled: false,
       gate_tracking: 0.0, gate_air_time: 0.0, gate_survival: 0.95, gate_upper: 0.0}
    - {name: a2_dr50, num_timesteps: 50_000_000, cmd_scale: 0.0, dr_scale: 0.5, push_scale: 0.0,
       arm_scale: 0.0, mode_probs: [1.0, 0.0, 0.0], switch_enabled: false,
       gate_tracking: 0.0, gate_air_time: 0.0, gate_survival: 0.95, gate_upper: 0.0}
    - {name: a3_dr100, num_timesteps: 50_000_000, cmd_scale: 0.0, dr_scale: 1.0, push_scale: 0.0,
       arm_scale: 0.0, mode_probs: [1.0, 0.0, 0.0], switch_enabled: false,
       gate_tracking: 0.0, gate_air_time: 0.0, gate_survival: 0.95, gate_upper: 0.0}
    - {name: a4_push50, num_timesteps: 75_000_000, cmd_scale: 0.0, dr_scale: 1.0, push_scale: 0.5,
       arm_scale: 0.0, mode_probs: [1.0, 0.0, 0.0], switch_enabled: false,
       gate_tracking: 0.0, gate_air_time: 0.0, gate_survival: 0.9, gate_upper: 0.0}
    - {name: a5_push100, num_timesteps: 100_000_000, cmd_scale: 0.0, dr_scale: 1.0, push_scale: 1.0,
       arm_scale: 0.0, mode_probs: [1.0, 0.0, 0.0], switch_enabled: false,
       gate_tracking: 0.0, gate_air_time: 0.0, gate_survival: 0.8, gate_upper: 0.0}

  teleop:                         # Stage B: velocity locomotion + upper-body tracking
    - {name: b1_walk_calm, num_timesteps: 150_000_000, cmd_scale: 0.5, dr_scale: 0.0, push_scale: 0.0,
       arm_scale: 0.0, mode_probs: [0.3, 0.7, 0.0], switch_enabled: false,
       gate_tracking: 0.956, gate_air_time: 0.004, gate_survival: 0.9, gate_upper: 0.0}
    - {name: b2_cmd100, num_timesteps: 150_000_000, cmd_scale: 1.0, dr_scale: 0.0, push_scale: 0.0,
       arm_scale: 0.0, mode_probs: [0.3, 0.7, 0.0], switch_enabled: false,
       gate_tracking: 0.875, gate_air_time: 0.004, gate_survival: 0.85, gate_upper: 0.0}
    - {name: b3_manip50, num_timesteps: 100_000_000, cmd_scale: 1.0, dr_scale: 0.0, push_scale: 0.0,
       arm_scale: 0.5, mode_probs: [0.2, 0.5, 0.3], switch_enabled: false,
       gate_tracking: 0.911, gate_air_time: 0.003, gate_survival: 0.85, gate_upper: 0.6}
    - {name: b4_manip100, num_timesteps: 100_000_000, cmd_scale: 1.0, dr_scale: 0.0, push_scale: 0.0,
       arm_scale: 1.0, mode_probs: [0.2, 0.5, 0.3], switch_enabled: false,
       gate_tracking: 0.911, gate_air_time: 0.003, gate_survival: 0.85, gate_upper: 0.6}
    - {name: b5_dr50, num_timesteps: 150_000_000, cmd_scale: 1.0, dr_scale: 0.5, push_scale: 0.0,
       arm_scale: 1.0, mode_probs: [0.2, 0.5, 0.3], switch_enabled: false,
       gate_tracking: 0.911, gate_air_time: 0.003, gate_survival: 0.8, gate_upper: 0.6}
    - {name: b6_dr100, num_timesteps: 150_000_000, cmd_scale: 1.0, dr_scale: 1.0, push_scale: 0.0,
       arm_scale: 1.0, mode_probs: [0.2, 0.5, 0.3], switch_enabled: false,
       gate_tracking: 0.911, gate_air_time: 0.003, gate_survival: 0.75, gate_upper: 0.6}
    - {name: b7_switch, num_timesteps: 100_000_000, cmd_scale: 1.0, dr_scale: 1.0, push_scale: 0.0,
       arm_scale: 1.0, mode_probs: [0.2, 0.5, 0.3], switch_enabled: true,
       gate_tracking: 0.929, gate_air_time: 0.003, gate_survival: 0.75, gate_upper: 0.6}
    - {name: b8_push50, num_timesteps: 150_000_000, cmd_scale: 1.0, dr_scale: 1.0, push_scale: 0.5,
       arm_scale: 1.0, mode_probs: [0.2, 0.5, 0.3], switch_enabled: true,
       gate_tracking: 0.929, gate_air_time: 0.003, gate_survival: 0.75, gate_upper: 0.6}
    - {name: b9_full, num_timesteps: 150_000_000, cmd_scale: 1.0, dr_scale: 1.0, push_scale: 1.0,
       arm_scale: 1.0, mode_probs: [0.2, 0.5, 0.3], switch_enabled: true,
       gate_tracking: 0.929, gate_air_time: 0.003, gate_survival: 0.8, gate_upper: 0.6}

distill:
  # DAgger distillation of the noise-free teacher into the CVAE student
  # (ULTRA ultra_agent_distill_vae.py, PPO term multiplied by 0 there too).
  num_envs: 2048
  unroll_length: 16
  num_minibatches: 8
  num_epochs: 2                   # ULTRA rlg mini_epochs 2
  learning_rate: 2.0e-4           # ULTRA rlg student lr 2e-4 -> lr_final 5e-5
  learning_rate_final: 5.0e-5
  num_iterations: 3000
  # ULTRA beta_t = max(1 - max((epoch - 50) / 500, 0), 0): teacher acts w.p. beta
  beta_hold_iters: 50
  beta_decay_iters: 500
  expert_loss_coef: 1.0           # ULTRA rlg expert_loss_coef 1
  # ULTRA cosine schedules over epochs 500-2000 (kld 0.001 -> 0.2, prior-action
  # 0 -> 0.6), 500-1500 (latent smoothness 1e-4 -> 1e-3)
  kld_coef: [0.001, 0.2]
  prior_action_coef: [0.0, 0.6]
  smooth_coef: [0.0001, 0.001]
  schedule_iters: [500, 2000]
  plateau_patience: 400
  seed: 1

logging:
  wandb: false                    # gate metrics are printed + evals.jsonl (skill M17)
